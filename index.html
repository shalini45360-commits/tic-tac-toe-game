<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  body { font-family: Arial, sans-serif; background:#f0f2f5; display:flex; justify-content:center; padding-top:40px; }
  .box { background:#fff; padding:24px; border-radius:12px; width:320px; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.1); }
  #board { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
  .cell { height:90px; font-size:42px; font-weight:bold; border:none; border-radius:8px; background:#e3e8ef; cursor:pointer; }
  .cell.x { color:#c62828; }
  .cell.o { color:#1565c0; }
  .cell.win { background:#a5d6a7; }
  #status { font-size:18px; font-weight:bold; }
  #reset { padding:10px 20px; font-size:16px; border:none; border-radius:6px; background:#2e7d32; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
  <h2>Tic Tac Toe</h2>
  <div id="status">Player X's turn</div>
  <div id="board"></div>
  <button id="reset">Restart</button>
</div>
<script>
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let cells, player, over;

function start() {
  cells = Array(9).fill("");
  player = "X";
  over = false;
  statusEl.textContent = "Player X's turn";
  boardEl.innerHTML = "";
  for (let i = 0; i < 9; i++) {
    const b = document.createElement("button");
    b.className = "cell";
    b.onclick = () => play(i, b);
    boardEl.appendChild(b);
  }
}

function play(i, btn) {
  if (cells[i] || over) return;
  cells[i] = player;
  btn.textContent = player;
  btn.classList.add(player.toLowerCase());

  const win = lines.find(l => l.every(n => cells[n] === player));
  if (win) {
    win.forEach(n => boardEl.children[n].classList.add("win"));
    statusEl.textContent = "Player " + player + " wins! 🎉";
    over = true;
  } else if (cells.every(c => c)) {
    statusEl.textContent = "It's a draw!";
    over = true;
  } else {
    player = player === "X" ? "O" : "X";
    statusEl.textContent = "Player " + player + "'s turn";
  }
}

document.getElementById("reset").onclick = start;
start();
</script>
</body>
</html>
